<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Docsify Site</title>
    <!-- Docsify Vue Theme for basic styling -->
    <link rel="stylesheet" href="//unpkg.com/docsify/lib/themes/vue.css" />
    <!-- GitHub Markdown CSS for GitHub-like appearance -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/4.0.0/github-markdown.min.css" />
  </head>
  <body>
    <div id="app"></div>

    <script>
      window.$docsify = {
        // Set meeting_notes.md as the homepage content.
        homepage: 'meeting_notes.md',
        // Enable sidebar support by loading _sidebar.md automatically.
        loadSidebar: true,
        // Optional: Enable navbar support if you create a _navbar.md.
        loadNavbar: false
      };
    </script>

    <!-- Docsify Core -->
    <script src="//unpkg.com/docsify/lib/docsify.min.js"></script>
  </body>
</html>
